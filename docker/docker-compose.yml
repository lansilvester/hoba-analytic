name: hoba

services:
  postgres:
    image: postgres:16-alpine
    container_name: hoba-postgres
    environment:
      POSTGRES_DB: hoba
      POSTGRES_USER: hoba
      POSTGRES_PASSWORD: hoba-secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoba -d hoba"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hoba-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    container_name: hoba-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: hoba-backend
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_KEY: base64:vMYsDrKI/rwwylRbN/L6FjyiD30bvLwHysCxTnEFeHA=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: hoba
      DB_USERNAME: hoba
      DB_PASSWORD: hoba-secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: predis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      PYTHON_API_URL: http://python-api:8001
      PHP_CLI_SERVER_WORKERS: "4"
    ports:
      - "8000:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/var/www/html

  worker:
    image: hoba-backend
    container_name: hoba-worker
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    command: ["sh", "-c", "php artisan queue:work redis --tries=3"]
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_KEY: base64:vMYsDrKI/rwwylRbN/L6FjyiD30bvLwHysCxTnEFeHA=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: hoba
      DB_USERNAME: hoba
      DB_PASSWORD: hoba-secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: predis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      PYTHON_API_URL: http://python-api:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/var/www/html

  python-api:
    build:
      context: ../python-api
      dockerfile: Dockerfile
    container_name: hoba-python-api
    environment:
      PORT: "8001"
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: hoba-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
